# 免构建安装：直接使用 GitHub 上发布的镜像（Release 里会带上对应版本号）
#
#   curl -fsSLO https://raw.githubusercontent.com/EVFBV/blfp-release-mirror/main/docker-compose.ghcr.yml
#   docker compose -f docker-compose.ghcr.yml up -d
#
# 想要"固定版本"就把 latest 换成具体版本号，例如 :1.0.0
services:
  blfp-mirror:
    image: ghcr.io/evfbv/blfp-release-mirror:latest
    container_name: blfp-release-mirror
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      GITHUB_REPO: EVFBV/blfp-client
      INCLUDE_PRERELEASE: "true"
      KEEP_VERSIONS: "1"
      SYNC_INTERVAL_SECONDS: "600"
      SYNC_ON_START: "true"
      # 公开仓库可不填；填了提升 GitHub API 限额（私有仓库需要）
      # GITHUB_TOKEN: "ghp_xxxxxxxx"
      # 公网部署建议设置，设置后写接口需要鉴权
      # API_TOKEN: "change-me"
    volumes:
      - blfp-data:/data

volumes:
  blfp-data:
