name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # 项目零第三方依赖，不需要 npm install
      - name: 语法检查
        run: for f in src/*.js; do node --check "$f"; done

      - name: 运行测试
        run: node --test test/*.test.js

  # 一键安装脚本的静态检查（脚本会被用户直接 curl | bash 执行，必须挡住语法/明显错误）
  script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash 语法检查
        run: bash -n install.sh

      - name: shellcheck
        run: shellcheck -S warning install.sh

      - name: 帮助信息可用
        run: bash install.sh --help | head -20

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t blfp-release-mirror:ci .

      - name: 启动容器并检查健康接口
        run: |
          docker run -d --name mirror -p 8080:8080 \
            -e SYNC_ON_START=false -e SYNC_INTERVAL_SECONDS=0 \
            blfp-release-mirror:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null; then
              echo "健康检查通过"; break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health
          curl -fsS http://127.0.0.1:8080/api/settings | head -20
          docker logs mirror
          docker rm -f mirror
