name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  # GHCR 的镜像名必须全小写，所以这里不能直接用 github.repository（owner 是 EVFBV）
  IMAGE: ghcr.io/evfbv/blfp-release-mirror

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 语法检查
        run: for f in src/*.js; do node --check "$f"; done
      - name: 运行测试
        run: node --test test/*.test.js

  # 构建并推送多架构镜像到 GHCR（amd64 + arm64，群晖/树莓派/NAS 都能用）
  publish-image:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # 只保留两个标签，避免包页面上一堆同 digest 的别名：
          #   1.0.0  -> 固定版本（生产环境推荐）
          #   latest -> 始终指向最新发布
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.licenses=MIT

      - name: 构建并推送
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 镜像摘要
        run: |
          echo "镜像: ${IMAGE}"
          echo "标签:"; echo "${{ steps.meta.outputs.tags }}"
          echo "摘要: ${{ steps.build.outputs.digest }}"

  # 冒烟测试：把刚推送的镜像真的拉下来跑一遍，验证 /health、首页与接口
  smoke-test:
    needs: publish-image
    runs-on: ubuntu-latest
    steps:
      - name: 拉取镜像并启动
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            IMAGE_TAG="${IMAGE}:${GITHUB_REF_NAME#v}"
          else
            IMAGE_TAG="${IMAGE}:latest"
          fi
          echo "测试镜像: ${IMAGE_TAG}"
          docker pull "${IMAGE_TAG}"
          docker run -d --name mirror -p 8080:8080 \
            -e SYNC_ON_START=false -e SYNC_INTERVAL_SECONDS=0 \
            "${IMAGE_TAG}"
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/health > /dev/null 2>&1 && break
            sleep 1
          done
          echo "--- /health"; curl -fsS http://127.0.0.1:8080/health
          echo "--- /api/settings"; curl -fsS http://127.0.0.1:8080/api/settings | head -12
          echo "--- 首页:"; curl -fsS -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:8080/
          echo "--- 容器日志:"; docker logs mirror
          docker rm -f mirror

  # 导出离线镜像包：镜像源都拉不动时，docker load 直接导入，无需任何仓库
  offline-image:
    needs: publish-image
    runs-on: ubuntu-latest
    steps:
      - name: 导出 amd64 / arm64 镜像包
        run: |
          VER="${{ needs.publish-image.outputs.version }}"
          [ -z "${VER}" ] && VER="${GITHUB_REF_NAME#v}"
          for ARCH in amd64 arm64; do
            docker pull --platform "linux/${ARCH}" "${IMAGE}:${VER}"
            # 同一 tag 换平台会覆盖，所以每拉一个就立刻导出
            docker save "${IMAGE}:${VER}" | gzip -9 > "blfp-release-mirror-${VER}-linux-${ARCH}.tar.gz"
          done
          sha256sum blfp-release-mirror-*.tar.gz > "blfp-release-mirror-${VER}-images.sha256"
          cat "blfp-release-mirror-${VER}-images.sha256"
          ls -lh blfp-release-mirror-*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: offline-images
          path: |
            blfp-release-mirror-*.tar.gz
            blfp-release-mirror-*-images.sha256
          retention-days: 7

  # 创建 Release，并附上可直接解压运行的源码包 + 离线镜像包
  release:
    needs: [publish-image, smoke-test, offline-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 打包源码
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="blfp-release-mirror-${TAG}"
          git archive --format=tar.gz --prefix="${NAME}/" -o "${NAME}.tar.gz" HEAD
          ls -lh "${NAME}.tar.gz"

      - name: 生成 Release 说明
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          cat > NOTES.md <<EOF
          Docker 镜像：\`${IMAGE}:${VER}\`（多架构：linux/amd64 + linux/arm64，另有 \`latest\`）

          ## 最快：一键脚本（自动挑延迟最低的镜像源）

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${TAG}/install.sh | bash
          \`\`\`

          脚本会逐个探测镜像源（含国内加速源）：**先确认真的能取到镜像数据（manifest + layer），
          再按实测延迟排序**，自动用最快的源拉取并启动容器；某个源拉取失败会自动降级到下一个。
          只想看各源延迟：\`bash install.sh --list\`；想先预览命令：\`bash install.sh --dry-run\`。

          ## 或手动拉镜像（下面用官方地址，也可换成任意加速源前缀）

          \`\`\`bash
          # 1) 拉镜像并运行（数据存在命名卷 blfp-data 里）
          docker run -d --name blfp-release-mirror --restart unless-stopped \\
            -p 8080:8080 \\
            -e GITHUB_REPO=EVFBV/blfp-client \\
            -e INCLUDE_PRERELEASE=true \\
            -e KEEP_VERSIONS=1 \\
            -e SYNC_INTERVAL_SECONDS=600 \\
            -v blfp-data:/data \\
            ${IMAGE}:${VER}

          # 2) 打开网页控制台（含"镜像配置"表单，可不重启直接换仓库）
          #    http://localhost:8080

          # 3) 常用接口
          curl http://localhost:8080/api/latest       # 最新版本信息
          curl -L -O -J http://localhost:8080/latest  # 直接下载最新版
          curl -X POST http://localhost:8080/api/sync  # 立即同步
          \`\`\`

          ## 或免克隆用 compose

          \`\`\`bash
          curl -fsSLO https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${TAG}/docker-compose.ghcr.yml
          docker compose -f docker-compose.ghcr.yml up -d
          \`\`\`

          ## 完全离线安装（不需要任何镜像源）

          \`\`\`bash
          # 下载本页附件里的镜像包后导入（arm64 设备换成 -arm64）
          gunzip -c blfp-release-mirror-${VER}-linux-amd64.tar.gz | docker load
          # 导入后镜像名就是 ${IMAGE}:${VER}，再用上面的 docker run 启动即可
          \`\`\`

          ## 附件

          - \`install.sh\` 在仓库里：\`curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${TAG}/install.sh | bash\`
          - \`blfp-release-mirror-${TAG}.tar.gz\`：完整源码包（解压后 \`node src/server.js\` 即可运行，无需 npm install）
          - \`blfp-release-mirror-${VER}-linux-amd64.tar.gz\` / \`-arm64.tar.gz\`：离线镜像包（\`docker load\` 直接导入）
          - \`blfp-release-mirror-${VER}-images.sha256\`：离线镜像包的 sha256 校验值

          环境变量表、API 文档、常见问题见仓库 README。
          EOF
          cat NOTES.md

      - uses: actions/download-artifact@v4
        with:
          name: offline-images

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} 已存在，补充/刷新附件"
            gh release edit "$TAG" --notes-file NOTES.md
            gh release upload "$TAG" blfp-release-mirror-*.tar.gz blfp-release-mirror-*.sha256 --clobber
          else
            gh release create "$TAG" \
              blfp-release-mirror-*.tar.gz blfp-release-mirror-*.sha256 \
              --title "blfp-release-mirror ${TAG}" \
              --notes-file NOTES.md \
              --verify-tag
          fi
          echo "--- 发布产物:"
          gh release view "$TAG" --json assets --jq '.assets[] | "  \(.name)  \(.size) bytes"'
