name: cleanup-packages

# 清理 GHCR 上的冗余镜像版本。
#
# 背景：GHCR 不支持单独删除某个标签（实测 DELETE .../manifests/<tag> 返回 HTTP 405），
#       所以只能按「包版本」删除。本工作流会保留带有 KEEP_TAG（默认 1.0.0）的那个版本，
#       删除其它版本（例如只剩 1.0 / v1.0.0 这类遗留别名的旧版本），
#       从而让包页面只剩一个版本、两个标签。
#
# 用法：Actions → cleanup-packages → Run workflow
#   keep_tag         要保留的标签（默认 1.0.0，即最新发布）
#   include_untagged 是否连无标签版本（构建证明等）一起删，默认 false
#   dry_run          默认 true，只打印不删除；确认无误再改成 false
on:
  workflow_dispatch:
    inputs:
      keep_tag:
        description: 要保留的版本标签（该版本会被保留，其余删除）
        required: false
        default: '1.0.0'
      include_untagged:
        description: 是否同时删除无标签版本（true/false）
        required: false
        default: 'false'
      align_tags:
        description: 需要重新指向 keep_tag 的别名标签，逗号分隔（留空跳过）
        required: false
        default: '1.0,v1.0.0'
      dry_run:
        description: 只打印不删除（true/false）
        required: false
        default: 'true'

permissions:
  contents: read
  packages: write

env:
  PACKAGE: blfp-release-mirror

jobs:
  # 让遗留别名标签（1.0 / v1.0.0）指向与 keep_tag 完全相同的镜像，
  # 避免出现「:1.0 拉到的是旧构建、:1.0.0 才是新的」这种坑。
  # 用 imagetools 直接改指向，不重新构建，几秒钟完成。
  align-tags:
    runs-on: ubuntu-latest
    if: ${{ inputs.align_tags != '' }}
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 把别名标签指到目标标签
        env:
          IMAGE: ghcr.io/evfbv/blfp-release-mirror
          ALIGN_TO: ${{ inputs.keep_tag }}
          ALIGN_TAGS: ${{ inputs.align_tags }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -uo pipefail
          echo "目标镜像：${IMAGE}:${ALIGN_TO}"
          for tag in $(echo "${ALIGN_TAGS}" | tr ',' ' '); do
            [ -z "${tag}" ] && continue
            [ "${tag}" = "${ALIGN_TO}" ] && continue
            if [ "${DRY_RUN}" = "true" ]; then
              echo "[dry-run] 将把 ${IMAGE}:${tag} 指向 ${IMAGE}:${ALIGN_TO}"
              continue
            fi
            if docker buildx imagetools create --tag "${IMAGE}:${tag}" "${IMAGE}:${ALIGN_TO}"; then
              echo "  ✔ ${tag} 已指向 ${ALIGN_TO}"
            else
              echo "  ✘ ${tag} 重指向失败"
            fi
          done

          echo "=== 校验各标签当前的 digest"
          for tag in ${ALIGN_TO} latest $(echo "${ALIGN_TAGS}" | tr ',' ' '); do
            [ -z "${tag}" ] && continue
            printf '  %-8s %s\n' "${tag}" "$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${IMAGE}:${tag}" 2>/dev/null || echo 取不到)"
          done

  prune-versions:
    runs-on: ubuntu-latest
    steps:
      - name: 保留指定版本、清理其余版本
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_TAG: ${{ inputs.keep_tag }}
          INCLUDE_UNTAGGED: ${{ inputs.include_untagged }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          API="/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE}/versions"

          echo "=== 当前所有版本（id / 创建时间 / 标签）"
          gh api --paginate "$API" > versions.json
          jq -r '.[] | "  \(.id)  \(.created_at)  tags=[\(.metadata.container.tags // [] | join(","))]"' versions.json

          KEEP_ID="$(jq -r --arg t "$KEEP_TAG" \
            '[.[] | select((.metadata.container.tags // []) | index($t))] | sort_by(.created_at) | last | .id // empty' versions.json)"
          if [ -z "$KEEP_ID" ]; then
            echo "❌ 找不到带标签 ${KEEP_TAG} 的版本，为避免误删，什么都不做"
            exit 1
          fi
          echo "=== 要保留的版本：id=${KEEP_ID}（含标签 ${KEEP_TAG}）"

          TARGETS="$(jq -r --arg keep "$KEEP_ID" --argjson untagged "$([ "$INCLUDE_UNTAGGED" = "true" ] && echo true || echo false)" \
            '.[] | select((.id | tostring) != $keep)
                 | select(((.metadata.container.tags // []) | length) > 0 or $untagged)
                 | "\(.id) \(.metadata.container.tags // [] | join(","))"' versions.json)"

          if [ -z "$TARGETS" ]; then
            echo "=== 没有需要清理的版本"
            exit 0
          fi

          echo "=== 计划删除："
          printf '  %s\n' "$TARGETS"

          if [ "$DRY_RUN" = "true" ]; then
            echo "=== dry_run=true，未执行删除（确认后改成 false 再跑一次）"
            exit 0
          fi

          while read -r id tags; do
            [ -z "$id" ] && continue
            if gh api -X DELETE "$API/$id"; then
              echo "  ✔ 已删除版本 id=${id}（tags=${tags:-无}）"
            else
              echo "  ✘ 删除失败 id=${id}"
            fi
          done <<< "$TARGETS"

          echo "=== 清理后的版本列表"
          gh api --paginate "$API" \
            | jq -r '.[] | "  \(.id)  \(.created_at)  tags=[\(.metadata.container.tags // [] | join(","))]"'
