name: cleanup-packages

# 清理 GHCR 上的冗余包版本与别名标签。
# 默认「保留最近 5 个版本，并删掉 1.0 / v1.0.0 这类多余的别名标签」。
on:
  workflow_dispatch:
    inputs:
      min_versions_to_keep:
        description: 保留最近几个镜像版本（旧的会被删除）
        required: false
        default: '5'
      delete_tags:
        description: 要额外删除的别名标签，逗号分隔（留空则跳过）
        required: false
        default: '1.0,v1.0.0'
      dry_run:
        description: 只打印、不真的删除（true/false）
        required: false
        default: 'false'

permissions:
  contents: read
  packages: write

env:
  PACKAGE: blfp-release-mirror
  IMAGE: ghcr.io/evfbv/blfp-release-mirror

jobs:
  # 1) 删除过期的镜像版本（每个版本 = 一个 digest，多架构镜像只占一个版本）
  prune-versions:
    runs-on: ubuntu-latest
    steps:
      - name: 保留最近 ${{ inputs.min_versions_to_keep }} 个版本，删除更旧的
        if: ${{ inputs.dry_run != 'true' }}
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.PACKAGE }}
          package-type: container
          min-versions-to-keep: ${{ inputs.min_versions_to_keep }}
          delete-only-untagged-versions: 'false'

      - name: 当前包版本一览
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "包: ${PACKAGE}"
          gh api "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE}/versions" \
            --jq '.[] | "  \(.id)  \(.created_at)  tags=\(.metadata.container.tags | join(","))"' || \
            echo "（无权限读取包信息，跳过列表；不影响删除操作）"

  # 2) 删除 1.0 / v1.0.0 这类和 1.0.0 指向同一 digest 的冗余标签
  delete-alias-tags:
    runs-on: ubuntu-latest
    if: ${{ inputs.delete_tags != '' }}
    steps:
      - name: 通过 GHCR 注册表 API 删除别名标签
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          TAGS: ${{ inputs.delete_tags }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -u
          REPO="evfbv/${PACKAGE}"

          # 用 Actions 的 GITHUB_TOKEN 换取带 push 权限的注册表 token
          TOKEN=$(curl -fsS -u "${ACTOR}:${GH_TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${REPO}:push,pull" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("token",""))')
          if [ -z "${TOKEN}" ]; then
            echo "❌ 拿不到带 push 权限的 token，无法删除标签"
            exit 1
          fi
          echo "✅ 已获取注册表 token"

          echo "--- 删除前的标签:"
          curl -fsS -H "Authorization: Bearer ${TOKEN}" "https://ghcr.io/v2/${REPO}/tags/list" \
            | python3 -c 'import json,sys; print("   ", ", ".join(json.load(sys.stdin).get("tags") or []))'

          for tag in $(echo "${TAGS}" | tr ',' ' '); do
            [ -z "${tag}" ] && continue
            if [ "${DRY_RUN}" = "true" ]; then
              echo "[dry-run] 将删除标签: ${tag}"
              continue
            fi
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/${REPO}/manifests/${tag}")
            case "${CODE}" in
              202|200) echo "✅ 已删除标签 ${tag} (HTTP ${CODE})" ;;
              404) echo "⏭  标签 ${tag} 不存在，跳过" ;;
              *) echo "⚠️  删除标签 ${tag} 失败 (HTTP ${CODE})" ;;
            esac
          done

          echo "--- 删除后的标签:"
          curl -fsS -H "Authorization: Bearer ${TOKEN}" "https://ghcr.io/v2/${REPO}/tags/list" \
            | python3 -c 'import json,sys; print("   ", ", ".join(json.load(sys.stdin).get("tags") or []))'
